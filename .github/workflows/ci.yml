name: CI

on:
  push:
    branches: [main, develope, "claude/**"]
  pull_request:
    branches: [main, develope]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-Mannager-System/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: Project-Mannager-System/backend/pom.xml

      - name: Build and test (mvn clean verify)
        run: mvn -B clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: Project-Mannager-System/backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-Mannager-System/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Project-Mannager-System/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
