spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pmdaily}
    username: ${DB_USERNAME:pmdaily}
    password: ${DB_PASSWORD:change-me-local}
  flyway:
    locations: classpath:db/migration
    target: latest

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars}
