spring:
  datasource:
    url: jdbc:h2:mem:pmdaily;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    locations: classpath:db/test-migration

app:
  jwt:
    secret: test-secret-at-least-32-chars-long!!
  storage:
    path: target/test-uploads
