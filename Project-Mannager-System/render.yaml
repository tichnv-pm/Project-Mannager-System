services:
  # ============================================================================
  # 1. BACKEND SERVICE (Spring Boot 3 + Java 21)
  # ============================================================================
  - type: web
    name: pmdaily-backend
    runtime: docker
    rootDir: Project-Mannager-System/backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        value: jdbc:postgresql://ep-purple-dream-azkoyql8-pooler.c-3.ap-southeast-1.aws.neon.tech/pmdaily?sslmode=require
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_BC8oekY2bZVi
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: "900000"
      - key: JWT_REFRESH_EXPIRATION
        value: "604800000"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: APP_WEBHOOK_GIT_SECRET
        generateValue: true

  # ============================================================================
  # 2. FRONTEND SERVICE (Angular 22 + Nginx Reverse Proxy)
  # ============================================================================
  - type: web
    name: pmdaily-frontend
    runtime: docker
    rootDir: Project-Mannager-System/frontend
    plan: free
    region: singapore
    envVars:
      - key: BACKEND_URL
        value: https://pmdaily-backend.onrender.com
