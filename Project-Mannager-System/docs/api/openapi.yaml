openapi: 3.1.0
info:
  title: PM Daily Work Management API
  version: 1.0.0
  description: |
    API cho ứng dụng quản lý công việc hằng ngày của quản lý dự án phần mềm.

    ## Quy ước chung
    - Base path: `/api/v1`
    - Xác thực: `Authorization: Bearer <accessToken>` (JWT HS256, hết hạn 15 phút). Refresh token (7 ngày) chỉ gửi ở `/auth/refresh` và `/auth/logout`.
    - Thời gian: ISO-8601 UTC (`timestamptz`). Ngày (date): `yyyy-MM-dd`.
    - Phân trang: `page` (≥ 0, mặc định 0), `size` (1–100, mặc định 20), `sort` (whitelist theo từng endpoint, VD `fullName,asc`).
    - Lỗi: format thống nhất (BR-GEN-05) — `timestamp, status, error, code, message, path, fieldErrors, traceId`. Catalog mã lỗi: `docs/design/05-error-handling-design.md`.
    - Dữ liệu đã xóa mềm: không xuất hiện ở danh sách; truy cập trực tiếp trả 404.
    - Cập nhật bắt buộc kèm `version`; version cũ → 409.
    - Chi tiết từng module: `docs/api/01..12-*.md`.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Auth
  - name: User Admin
  - name: Dashboard
  - name: Project
  - name: Task
  - name: Meeting
  - name: Action Item
  - name: Risk
  - name: Issue
  - name: Milestone
  - name: Notification
  - name: Report
  - name: Audit
paths:
  # ============================= AUTH =============================
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, cấp cặp token (access + refresh)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '401':
          description: Sai username/mật khẩu hoặc tài khoản INACTIVE (message chung)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Cấp cặp token mới (rotation — token cũ bị revoke)
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized401' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất, revoke refresh token (idempotent)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Thành công, không body }
        '401': { $ref: '#/components/responses/Unauthorized401' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Thông tin user + roles + permissions hiện tại (không chứa password hash)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Thông tin tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized401' }
  /auth/change-password:
    put:
      tags: [Auth]
      summary: Đổi mật khẩu (revoke toàn bộ refresh token)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Thành công, không body }
        '400': { $ref: '#/components/responses/Validation400' }
        '401': { $ref: '#/components/responses/Unauthorized401' }
  /auth/{userId}/reset-password:
    post:
      tags: [Auth]
      summary: ADMIN reset mật khẩu cho user khác
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Thành công, không body }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
  # ============================= USER ADMIN =============================
  /users:
    get:
      tags: [User Admin]
      summary: Danh sách người dùng (search/filter/paging)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
        - { name: keyword, in: query, schema: { type: string }, description: LIKE trên username/fullName/email }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: roleCode, in: query, schema: { type: string } }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '403': { $ref: '#/components/responses/Forbidden403' }
    post:
      tags: [User Admin]
      summary: Tạo tài khoản (mật khẩu tạm)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '409': { $ref: '#/components/responses/Duplicate409' }
  /users/{id}:
    get:
      tags: [User Admin]
      summary: Chi tiết user + vai trò + quyền
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserIdPath' }
      responses:
        '200':
          description: Thông tin user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
    put:
      tags: [User Admin]
      summary: Sửa thông tin & vai trò
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
  /users/{id}/status:
    patch:
      tags: [User Admin]
      summary: Kích hoạt / vô hiệu hóa tài khoản (INACTIVE → revoke refresh tokens)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusRequest' }
      responses:
        '200':
          description: Đã cập nhật trạng thái
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { description: ADMIN không được vô hiệu hóa chính mình, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
  /roles:
    get:
      tags: [User Admin]
      summary: Danh sách vai trò kèm quyền
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách vai trò
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
  /roles/{roleId}/permissions:
    put:
      tags: [User Admin]
      summary: Gán quyền cho vai trò (thay thế toàn bộ)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePermissionsRequest' }
      responses:
        '200':
          description: Đã cập nhật quyền
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '400': { description: Gỡ quyền cuối của ADMIN / permissionIds rỗng, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
  # ============================= DASHBOARD =============================
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: 10 nhóm số liệu tổng quan hằng ngày
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdQuery' }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Tổng quan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummaryResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
  /dashboard/task-stats:
    get:
      tags: [Dashboard]
      summary: Biểu đồ tasksByStatus + tasksByPriority
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdQuery' }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Thống kê
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardTaskStatsResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
  /dashboard/projects/progress:
    get:
      tags: [Dashboard]
      summary: Biểu đồ tiến độ dự án
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdQuery' }
      responses:
        '200':
          description: Tiến độ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardProjectsProgressResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
  # ============================= PROJECT =============================
  /projects:
    get:
      tags: [Project]
      summary: Danh sách dự án (search/filter/paging)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { name: myOnly, in: query, schema: { type: boolean } }
        - { name: projectManagerId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
    post:
      tags: [Project]
      summary: Tạo dự án (PM trở thành thành viên)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '409': { $ref: '#/components/responses/Duplicate409' }
  /projects/{id}:
    get:
      tags: [Project]
      summary: Chi tiết dự án
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdPath' }
      responses:
        '200':
          description: Thông tin dự án
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
    put:
      tags: [Project]
      summary: Cập nhật dự án (optimistic locking)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateRequest' }
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
    delete:
      tags: [Project]
      summary: Xóa mềm dự án (confirm khi còn task mở)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdPath' }
        - { name: confirm, in: query, schema: { type: boolean, default: false } }
      responses:
        '204': { description: Thành công, không body }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
  /projects/{id}/members:
    get:
      tags: [Project]
      summary: Danh sách thành viên dự án
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdPath' }
      responses:
        '200':
          description: Danh sách thành viên
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
    post:
      tags: [Project]
      summary: Thêm thành viên vào dự án
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberRequest' }
      responses:
        '201':
          description: Đã thêm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Duplicate409' }
  /projects/{id}/members/{userId}:
    put:
      tags: [Project]
      summary: Đổi vai trò thành viên trong dự án
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdPath' }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMemberRequest' }
      responses:
        '200':
          description: Đã cập nhật vai trò
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMemberResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
    delete:
      tags: [Project]
      summary: Xóa thành viên khỏi dự án (chặn xóa PM cuối)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdPath' }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Thành công, không body }
        '400':
          description: PROJECT_MANAGER_REQUIRED khi xóa PM cuối
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
  # ============================= TASK =============================
  /tasks:
    get:
      tags: [Task]
      summary: Danh sách công việc (nhiều filter)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/ProjectIdQuery' }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TaskStatus' } } }
        - { name: priority, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TaskPriority' } } }
        - { name: type, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TaskType' } } }
        - { name: tagId, in: query, schema: { type: string, format: uuid } }
        - { name: startDateFrom, in: query, schema: { type: string, format: date } }
        - { name: startDateTo, in: query, schema: { type: string, format: date } }
        - { name: dueDateFrom, in: query, schema: { type: string, format: date } }
        - { name: dueDateTo, in: query, schema: { type: string, format: date } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: blocked, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummaryPage' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
    post:
      tags: [Task]
      summary: Tạo công việc (mã tự sinh PRJXXX-TASK-000001)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '400': { $ref: '#/components/responses/Validation400' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
  /tasks/my-tasks:
    get:
      tags: [Task]
      summary: Công việc được giao cho tôi (assignee = me)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/ProjectIdQuery' }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummaryPage' }
  /tasks/today:
    get:
      tags: [Task]
      summary: Công việc hạn hôm nay (theo timezone user)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/ProjectIdQuery' }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummaryPage' }
  /tasks/overdue:
    get:
      tags: [Task]
      summary: Công việc quá hạn chưa đóng
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/ProjectIdQuery' }
      responses:
        '200':
          description: Trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummaryPage' }
  /tasks/export:
    get:
      tags: [Task]
      summary: Xuất Excel danh sách task theo filter hiện tại
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectIdQuery' }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/TaskStatus' } } }
        - { name: overdue, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: File Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400':
          description: EXPORT_LIMIT_EXCEEDED (quá 10.000 dòng)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
  /tasks/{id}:
    get:
      tags: [Task]
      summary: Chi tiết công việc
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      responses:
        '200':
          description: Chi tiết task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
    put:
      tags: [Task]
      summary: "Cập nhật công việc (MEMBER: chỉ task của mình, trường status/progress/notes)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      requestBody:
        required: true
        content:
