    AssigneeCountItems:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              assigneeId: { type: string, format: uuid }
              fullName: { type: string }
              count: { type: integer }
              doneCount: { type: integer }
    ProjectProgressReportResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              progress: { type: integer }
              totalTasks: { type: integer }
              doneTasks: { type: integer }
    RiskIssueSummaryResponse:
      type: object
      properties:
        openRisks: { type: integer }
        openIssues: { type: integer }
