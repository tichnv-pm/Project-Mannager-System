components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      description: Số trang (từ 0)
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Số bản ghi mỗi trang
    Sort:
      name: sort
      in: query
      schema: { type: string }
      description: 'Sắp xếp theo whitelist của endpoint, VD `fullName,asc`'
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID dự án
    ProjectIdQuery:
      name: projectId
      in: query
      schema: { type: string, format: uuid }
      description: Lọc theo dự án
    ProjectIdQueryRequired:
      name: projectId
      in: query
      required: true
      schema: { type: string, format: uuid }
      description: ID dự án (bắt buộc)
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID người dùng
    TaskIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID công việc
    MeetingIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID cuộc họp
    ActionItemIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID action item
    RiskIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID risk
    IssueIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID issue
    MilestoneIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: ID milestone
  responses:
    Validation400:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized401:
      description: Token thiếu/sai/hết hạn
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden403:
      description: Không đủ quyền hoặc ngoài phạm vi dữ liệu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound404:
      description: Không tìm thấy (bao gồm dữ liệu đã xóa mềm)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict409:
      description: Xung đột optimistic locking (version cũ)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Duplicate409:
      description: Dữ liệu trùng (username/email/mã)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge413:
      description: File vượt quá kích thước cho phép (10MB)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    # ---------- Chung ----------
    ErrorResponse:
      type: object
      required: [timestamp, status, error, code, message, path, fieldErrors, traceId]
      properties:
        timestamp: { type: string, format: date-time, example: '2026-08-01T10:00:00Z' }
        status: { type: integer, example: 400 }
        error: { type: string, example: BAD_REQUEST }
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: 'Dữ liệu không hợp lệ' }
        path: { type: string, example: /api/v1/tasks }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        traceId: { type: string, example: a1b2c3d4-1234 }
    PageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, hasNext, hasPrevious]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }
    UserRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
    # ---------- Enum ----------
    UserStatus: { type: string, enum: [ACTIVE, INACTIVE] }
    TaskStatus: { type: string, enum: [TODO, IN_PROGRESS, BLOCKED, REVIEW, DONE, CANCELLED] }
    TaskPriority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    TaskType: { type: string, enum: [FEATURE, BUG, IMPROVEMENT, TASK, OTHER] }
    TaskSource: { type: string, enum: [MANUAL, MEETING, ACTION_ITEM, ISSUE, OTHER] }
    ProjectStatus: { type: string, enum: [PLANNING, ACTIVE, ON_HOLD, COMPLETED, CANCELLED] }
    ProjectMemberRole: { type: string, enum: [PROJECT_MANAGER, TECH_LEAD, BUSINESS_ANALYST, DEVELOPER, TESTER, DEVOPS, MEMBER] }
    MeetingStatus: { type: string, enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED] }
    ActionItemStatus: { type: string, enum: [OPEN, IN_PROGRESS, DONE, CANCELLED] }
    RiskStatus: { type: string, enum: [OPEN, MONITORING, MITIGATED, OCCURRED, CLOSED] }
    RiskLevel: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    RiskProbability: { type: string, enum: [LOW, MEDIUM, HIGH] }
    RiskImpact: { type: string, enum: [LOW, MEDIUM, HIGH] }
    IssueSeverity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    IssueStatus: { type: string, enum: [OPEN, ANALYZING, IN_PROGRESS, RESOLVED, CLOSED, REJECTED] }
    MilestoneStatus: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, DELAYED, CANCELLED] }
    NotificationType: { type: string, enum: [TASK_ASSIGNED, TASK_DUE_SOON, TASK_OVERDUE, TASK_COMMENTED, MEETING_INVITED, ACTION_ITEM_ASSIGNED] }
    # ---------- Auth ----------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        password: { type: string, minLength: 8, maxLength: 72 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: '≥ 8 ký tự, chữ thường + hoa + số + ký tự đặc biệt (BR-AUTH-02)'
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 8, maxLength: 72 }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: 'Giây (900)' }
        user: { $ref: '#/components/schemas/UserResponse' }
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    UserCreateRequest:
      type: object
      required: [username, email, fullName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email, maxLength: 100 }
        fullName: { type: string, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 72 }
        status: { $ref: '#/components/schemas/UserStatus' }
        roleIds:
          type: array
          items: { type: string, format: uuid }
    UserUpdateRequest:
      type: object
      required: [fullName, email, version]
      properties:
        fullName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 100 }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        version: { type: integer }
    UserStatusRequest:
      type: object
      required: [status, version]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
        version: { type: integer }
    RoleResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
    RolePermissionsRequest:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    UserPage:
      allOf:
        - { $ref: '#/components/schemas/PageResponse' }
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/UserResponse' }
    # ---------- Dashboard ----------
    DashboardSummaryResponse:
      type: object
      properties:
        totalTasksToday: { type: integer }
        overdueTasks: { type: integer }
        upcomingTasks: { type: integer }
        inProgressTasks: { type: integer }
        blockedTasks: { type: integer }
        meetingsToday: { type: integer }
        pendingActionItems: { type: integer }
        highRisks: { type: integer }
        openIssues: { type: integer }
        upcomingMilestones: { type: integer }
    DashboardTaskStatsResponse:
      type: object
      properties:
        tasksByStatus:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/TaskStatus' }
              count: { type: integer }
        tasksByPriority:
          type: array
          items:
            type: object
            properties:
              priority: { $ref: '#/components/schemas/TaskPriority' }
              count: { type: integer }
    DashboardProjectsProgressResponse:
      type: object
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectProgressItem' }
    ProjectProgressItem:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
    # ---------- Project ----------
    ProjectCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 3, maxLength: 20 }
        name: { type: string, maxLength: 100 }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        customerName: { type: string, maxLength: 100 }
        projectManagerId: { type: string, format: uuid }
        note: { type: string }
    ProjectUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/ProjectCreateRequest' }
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    ProjectResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        projectManagerId: { type: string, format: uuid }
        customerName: { type: string }
        progress: { type: integer }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    ProjectMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ProjectMemberRole' }
    ProjectMemberResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/ProjectMemberRole' }
        joinedAt: { type: string, format: date-time }
    ProjectPage:
      allOf:
        - { $ref: '#/components/schemas/PageResponse' }
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/ProjectResponse' }
    # ---------- Task ----------
    TaskCreateRequest:
      type: object
      required: [projectId, title]
      properties:
        projectId: { type: string, format: uuid }
        parentTaskId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string }
        assigneeId: { type: string, format: uuid }
        collaboratorIds:
          type: array
          items: { type: string, format: uuid }
        watcherIds:
          type: array
          items: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        type: { $ref: '#/components/schemas/TaskType' }
        source: { $ref: '#/components/schemas/TaskSource' }
        startDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        progress: { type: integer, minimum: 0, maximum: 100 }
        blocked: { type: boolean }
        blockerReason: { type: string, maxLength: 500 }
        estimateMinutes: { type: integer, minimum: 0 }
        notes: { type: string }
        tagIds:
          type: array
          items: { type: string, format: uuid }
    TaskUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/TaskCreateRequest' }
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    TaskAssigneeRequest:
      type: object
      properties:
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: null để gỡ người thực hiện
    TaskStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/TaskStatus' }
        blockerReason: { type: string, maxLength: 500, description: 'Bắt buộc khi status = BLOCKED' }
    TaskProgressRequest:
      type: object
      required: [progress]
      properties:
        progress: { type: integer, minimum: 0, maximum: 100 }
    TaskBlockerRequest:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }
        blockerReason: { type: string, maxLength: 500, description: 'Bắt buộc khi blocked = true' }
    TagIdsRequest:
      type: object
      required: [tagIds]
      properties:
        tagIds:
          type: array
          items: { type: string, format: uuid }
    UserIdsRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items: { type: string, format: uuid }
    CommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    CommentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AttachmentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        fileUrl: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        uploadedBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
    TaskResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: PRJ001-TASK-000001 }
        projectId: { type: string, format: uuid }
        projectCode: { type: string }
        projectName: { type: string }
        parentTaskId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        description: { type: string }
        reporter: { $ref: '#/components/schemas/UserRef' }
        assignee: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        type: { $ref: '#/components/schemas/TaskType' }
        source: { $ref: '#/components/schemas/TaskSource' }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        actualCompletedAt: { type: string, format: date-time, nullable: true }
        progress: { type: integer }
        blocked: { type: boolean }
        blockerReason: { type: string, nullable: true }
        estimateMinutes: { type: integer, nullable: true }
        actualMinutes: { type: integer, nullable: true }
        notes: { type: string }
        tags:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              color: { type: string }
        collaborators:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        watchers:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        commentCount: { type: integer }
        attachmentCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
    TaskSummaryResponse:
      allOf:
        - { $ref: '#/components/schemas/TaskResponse' }
        - type: object
          description: Rút gọn cho danh sách (bỏ description/notes đầy đủ nếu cần)
    TaskHistoryEntry:
      type: object
      properties:
        changedAt: { type: string, format: date-time }
        changedBy: { type: string, format: uuid }
        changedByUsername: { type: string }
        action: { type: string }
        changes:
          type: object
          additionalProperties:
            type: object
            properties:
              from: { type: object, nullable: true }
              to: { type: object, nullable: true }
    TaskSummaryPage:
      allOf:
        - { $ref: '#/components/schemas/PageResponse' }
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/TaskSummaryResponse' }
    # ---------- Meeting ----------
    MeetingCreateRequest:
      type: object
      required: [projectId, title, startTime, endTime, chairpersonId]
      properties:
        projectId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        location: { type: string, maxLength: 255 }
        meetingLink: { type: string, maxLength: 500 }
        chairpersonId: { type: string, format: uuid }
        participantIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        agenda: { type: string }
        status: { $ref: '#/components/schemas/MeetingStatus' }
    MeetingUpdateRequest:
      allOf:
        - { $ref: '#/components/schemas/MeetingCreateRequest' }
        - type: object
          required: [version]
          properties:
            version: { type: integer }
    MeetingCompleteRequest:
      type: object
      required: [conclusion]
      properties:
        content: { type: string }
        conclusion: { type: string }
    MeetingParticipantsRequest:
      type: object
      properties:
        add:
          type: array
          items: { type: string, format: uuid }
        remove:
          type: array
          items: { type: string, format: uuid }
    MeetingResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectCode: { type: string }
        projectName: { type: string }
        title: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        location: { type: string, nullable: true }
        meetingLink: { type: string, nullable: true }
        chairperson: { $ref: '#/components/schemas/UserRef' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        agenda: { type: string }
        content: { type: string }
        conclusion: { type: string }
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/ActionItemSummary' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentResponse' }
        createdAt: { type: string, format: date-time }
        version: { type: integer }
    MeetingPage:
      allOf:
        - { $ref: '#/components/schemas/PageResponse' }
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/MeetingResponse' }
    # ---------- Action Item ----------
    ActionItemCreateRequest:
      type: object
      required: [meetingId, projectId, title, assigneeId]
      properties:
        meetingId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string }
        assigneeId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
        priority: { $ref: '#/components/schemas/TaskPriority' }
