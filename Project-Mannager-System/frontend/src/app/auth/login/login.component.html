<div class="login-container">
  <div class="login-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-badge">PM</div>
      <h1 class="brand-title">PM Daily</h1>
      <p class="brand-subtitle">Hệ thống Quản lý Công việc Quản lý Dự án</p>
    </div>

    <div *ngIf="errorMessage()" class="alert-box alert-danger">
      <span class="alert-icon">⚠️</span>
      <span>{{ errorMessage() }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Tên đăng nhập / Email</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Nhập tên đăng nhập"
            [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
            autocomplete="username"
          />
        </div>
        <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="invalid-feedback">
          <small *ngIf="loginForm.get('username')?.errors?.['required']">Tên đăng nhập không được bỏ trống</small>
          <small *ngIf="loginForm.get('username')?.errors?.['minlength']">Tối thiểu 3 ký tự</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Nhập mật khẩu"
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            autocomplete="current-password"
          />
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="invalid-feedback">
          <small *ngIf="loginForm.get('password')?.errors?.['required']">Mật khẩu không được bỏ trống</small>
          <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Tối thiểu 6 ký tự</small>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting() || loginForm.invalid">
        <span *ngIf="!isSubmitting()">Đăng nhập</span>
        <span *ngIf="isSubmitting()" class="spinner-loader">Đang xử lý...</span>
      </button>
    </form>

    <div class="card-footer">
      <p>Quên mật khẩu? Liên hệ <strong>Quản trị viên (ADMIN)</strong> để reset.</p>
    </div>
  </div>
</div>
